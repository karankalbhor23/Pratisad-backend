# Standalone VPS overlay (bundled Postgres in docker-compose.yml).
# For Scaleopal shared-stack VPS, use docker-compose.vps.yml instead — see DEPLOYMENT.md.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  postgres:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  api:
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: "postgresql://pratisad_user:${POSTGRES_PASSWORD}@postgres:5432/pratisad_db?schema=public"
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      E2E_AUTH_BYPASS: "false"
