# Standalone VPS overlay (bundled Postgres in docker-compose.yml).
# For Scaleopal shared-stack VPS, use docker-compose.vps.yml instead — see DEPLOYMENT.md.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  postgres:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  api:
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: "postgresql://pratisad_user:${POSTGRES_PASSWORD}@postgres:5432/pratisad_db?schema=public"
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      GOOGLE_OAUTH_STATE_SECRET: ${GOOGLE_OAUTH_STATE_SECRET:-}
      WEB_APP_ORIGIN: ${WEB_APP_ORIGIN:-}
      GOOGLE_REVIEWS_MANUAL_SYNC_COOLDOWN_MS: ${GOOGLE_REVIEWS_MANUAL_SYNC_COOLDOWN_MS:-0}
      E2E_AUTH_BYPASS: "false"
